server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS; variables below make nginx start even if a service is still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /notify/ {
    set $notify_upstream http://notify:8081;
    proxy_pass $notify_upstream;
    proxy_set_header Host $host;
  }
  location /analytics/ {
    set $analytics_upstream http://analytics:8000;
    proxy_pass $analytics_upstream;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
