name: aurum-dental

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports: ["9094:9094"]          # for running services on your own machine (outside Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:                              # Java 21 + Spring Boot
    build: ./backend-java
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/aurum
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: change-this-to-a-long-random-secret-before-going-live-2026
      CORS_ORIGINS: http://localhost:4200
    ports: ["8080:8080"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notify:                           # Kotlin + Spring Boot (Kafka consumer)
    build: ./notification-kotlin
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/aurum
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8081:8081"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics:                        # Python + FastAPI (Kafka consumer)
    build: ./analytics-python
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/aurum
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:                              # Angular, served by nginx
    build: ./frontend
    restart: unless-stopped
    ports: ["4200:80"]
    depends_on: [api, notify, analytics]

volumes:
  mongo_data:
